<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tell me your idea</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#1b1226;--ink:#f6ecff;--muted:#b9a7cc;--a:#ff5fa2;--b:#ffb36b;--c:#7a5cff;--card:#2a1c3a}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;overflow-x:hidden}
.blob{position:fixed;width:46vmax;height:46vmax;left:0;top:0;border-radius:50%;
  background:conic-gradient(from 0deg,var(--a),var(--b),var(--c),var(--a));
  filter:blur(90px);opacity:.45;pointer-events:none;animation:spin 18s linear infinite;transform:translate(-50%,-50%)}
@keyframes spin{to{rotate:360deg}}
.lang{position:fixed;top:18px;right:18px;z-index:10;display:flex;align-items:center;gap:8px;
  font:inherit;font-weight:600;font-size:.95rem;color:var(--ink);cursor:pointer;
  background:#ffffff14;backdrop-filter:blur(10px);border:1px solid #ffffff2e;border-radius:999px;padding:9px 16px;
  animation:drop .8s .9s cubic-bezier(.2,1.4,.4,1) backwards;transition:transform .2s,background .2s}
.lang:hover{transform:scale(1.06);background:#ffffff26}
.lang b{width:8px;height:8px;border-radius:50%;background:linear-gradient(var(--a),var(--b))}
@keyframes drop{from{transform:translateY(-60px);opacity:0}}
main{position:relative;max-width:1000px;margin:0 auto;padding:12vh 24px 10vh}
h1{font-size:clamp(3rem,11vw,8rem);line-height:.95;font-weight:800;letter-spacing:-.03em}
h1 .w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.08em;margin-right:.22em}
h1 .w span{display:inline-block;transform:translateY(110%);animation:up .9s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*.12s + .2s)}
@keyframes up{to{transform:none}}
.lead{max-width:34rem;margin:28px 0 56px;font-size:1.2rem;line-height:1.55;color:var(--muted)}
form{background:color-mix(in srgb,var(--card) 85%,transparent);backdrop-filter:blur(10px);
  border:1px solid #ffffff1c;border-radius:28px;padding:32px;display:grid;gap:18px;max-width:640px}
label{display:grid;gap:8px;font-weight:600}
input,textarea{font:inherit;color:var(--ink);background:#150d1e;border:1.5px solid #ffffff22;border-radius:14px;padding:14px 16px;transition:border-color .2s,box-shadow .2s}
textarea{min-height:170px;resize:vertical;line-height:1.5}
input:focus,textarea:focus{outline:none;border-color:var(--a);box-shadow:0 0 0 4px #ff5fa233}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-weight:800;border:0;border-radius:999px;padding:15px 30px;cursor:pointer;color:#2a0f1c;
  background:linear-gradient(90deg,var(--a),var(--b));transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 10px 30px #ff5fa255}
.btn:active{transform:scale(.97)}
.btn.ghost{background:none;color:var(--ink);border:1.5px solid #ffffff33;font-weight:600}
.note{font-size:.95rem;color:var(--muted);min-height:1.4em}
.ok{animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
:focus-visible{outline:3px solid var(--b);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}h1 .w span{transform:none}}
</style>
</head>
<body>
<div class="blob" id="blob"></div>
<button class="lang" id="lang" type="button" aria-label="Switch language"><b></b><span id="langtxt">Превод на български</span></button>

<main>
  <h1 id="title"></h1>
  <p class="lead" data-t="lead"></p>
  <form id="f">
    <label><span data-t="l_name"></span><input id="name" required data-p="p_name" autocomplete="name"></label>
    <label><span data-t="l_contact"></span><input id="contact" required data-p="p_contact" autocomplete="email"></label>
    <label><span data-t="l_desc"></span><textarea id="desc" required data-p="p_desc"></textarea></label>
    <div class="row">
      <button class="btn" type="submit" data-t="send"></button>
      <button class="btn ghost" type="button" id="copy" data-t="copy"></button>
    </div>
    <p class="note" id="note" role="status"></p>
  </form>
</main>

<script>
// >>> CHANGE THIS TO YOUR EMAIL <<<
const MY_EMAIL = "valster111@outlook.com";

const T = {
  en:{title:"Tell me what you want.",lead:"Describe your idea, project or question in a few sentences. Your message comes straight to me.",
    l_name:"Your name",l_contact:"How can I reach you",l_desc:"Describe what you want",
    p_name:"John Smith",p_contact:"Email or phone",p_desc:"Write freely...",
    send:"Send",copy:"Copy text",btn:"Превод на български",
    subj:"New message from ",nm:"Name: ",ct:"Contact: ",
    sent:"Your email app is opening. Press Send there to deliver the message to me.",
    copied:"Text copied.",fail:"Copy failed. Select the text manually."},
  bg:{title:"Разкажи ми какво искаш.",lead:"Опиши с няколко изречения идеята, проекта или въпроса си. Съобщението ти идва директно при мен.",
    l_name:"Как се казваш",l_contact:"Как да се свържа с теб",l_desc:"Опиши какво искаш",
    p_name:"Иван Иванов",p_contact:"Имейл или телефон",p_desc:"Пиши свободно...",
    send:"Изпрати",copy:"Копирай текста",btn:"Translate to English",
    subj:"Ново съобщение от ",nm:"Име: ",ct:"Контакт: ",
    sent:"Отваря се имейл програмата ти. Натисни „Изпрати“ там, за да стигне съобщението до мен.",
    copied:"Текстът е копиран.",fail:"Копирането не успя. Маркирай текста ръчно."}
};
let lang = 'en';
const $ = id => document.getElementById(id);
const note = $('note');

function apply(animate){
  const t = T[lang];
  document.documentElement.lang = lang;
  document.title = lang==='en' ? "Tell me your idea" : "Разкажи ми идеята си";
  document.querySelectorAll('[data-t]').forEach(e => e.textContent = t[e.dataset.t]);
  document.querySelectorAll('[data-p]').forEach(e => e.placeholder = t[e.dataset.p]);
  $('langtxt').textContent = t.btn;
  note.textContent = '';
  const h = $('title');
  h.setAttribute('aria-label', t.title);
  h.innerHTML = t.title.split(' ').map((w,i) => '<span class="w"><span style="--i:'+i+'">'+w+'</span></span>').join('');
}
apply();
$('lang').addEventListener('click', () => { lang = lang==='en' ? 'bg' : 'en'; apply(); });

// soft blob following the cursor
const blob = $('blob');
let tx = innerWidth*.3, ty = innerHeight*.3, x = tx, y = ty;
addEventListener('pointermove', e => { tx = e.clientX; ty = e.clientY; });
(function loop(){ x += (tx-x)*.04; y += (ty-y)*.04; blob.style.left=x+'px'; blob.style.top=y+'px'; requestAnimationFrame(loop); })();

const t = () => T[lang];
const build = () => t().nm+$('name').value+"\n"+t().ct+$('contact').value+"\n\n"+$('desc').value;

$('f').addEventListener('submit', e => {
  e.preventDefault();
  location.href = "mailto:"+MY_EMAIL+"?subject="+encodeURIComponent(t().subj+$('name').value)+"&body="+encodeURIComponent(build());
  note.className = 'note ok'; note.textContent = t().sent;
});
$('copy').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(build()); note.textContent = t().copied; }
  catch { note.textContent = t().fail; }
  note.className = 'note ok';
});
</script>
</body>
</html>
